name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '51 3 * * 6'
permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake --preset release
      - run: cmake --build --preset release --target stellar_xdr
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:cpp
