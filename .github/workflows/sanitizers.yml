name: sanitizers
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  asan-ubsan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libcurl4-openssl-dev
      - name: Install deps (macos)
        if: runner.os == 'macOS'
        run: brew install libsodium curl
      - run: cmake --preset asan-ubsan
      - run: cmake --build --preset asan-ubsan
      - name: Test
        run: ctest --preset asan-ubsan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          MallocNanoZone: "0"   # ASan on macOS needs nanozone off to interpose

  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libsodium-dev libcurl4-openssl-dev
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan
      - run: ctest --preset tsan
