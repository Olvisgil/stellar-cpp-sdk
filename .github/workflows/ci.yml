name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  codegen:
    # Generated files must be byte-identical to a fresh regeneration, and the
    # vendored XDR inputs must match their recorded sha256s.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/xdrgen/generate.py --check
      - run: python3 tools/update_xdr.py --check

  format:
    # clang-format on handwritten sources only; generated code is excluded.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/llvm.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-19
      - run: |
          git ls-files '*.hpp' '*.cpp' ':(exclude)*/generated/*' \
            | xargs clang-format-19 --dry-run --Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: dev, cc: gcc, cxx: g++ }
          - { os: ubuntu-24.04, preset: dev, cc: clang, cxx: clang++ }
          - { os: macos-15, preset: dev }
          - { os: windows-2022, preset: msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install clang (ubuntu)
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install libsodium (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libcurl4-openssl-dev
      - name: Install libsodium (macos)
        if: runner.os == 'macOS'
        run: brew install libsodium curl
      - name: Install libsodium (windows)
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 -b stable https://github.com/jedisct1/libsodium $env:TEMP\libsodium
          cd $env:TEMP\libsodium
          .\msvc-scripts\msvc-test.ps1 -MsvcToolset v143 -BuildConfiguration Release -PlatformToolset v143 -Platform x64 -OutDir $env:TEMP\libsodium-out -DistPackages $false
          echo "SODIUM_ROOT=$env:TEMP\libsodium" >> $env:GITHUB_ENV
        shell: pwsh
      - name: Configure (windows env)
        if: runner.os == 'Windows'
        env:
          SODIUM_LIBRARY: ${{ runner.temp }}\libsodium\Build\Release\x64\libsodium.lib
          SODIUM_INCLUDE_DIR: ${{ runner.temp }}\libsodium\src\libsodium\include
          CMAKE_TOOLCHAIN_FILE: ""
        run: cmake --preset ${{ matrix.preset }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
