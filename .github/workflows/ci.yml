name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  codegen:
    # Generated files must be byte-identical to a fresh regeneration, and the
    # vendored XDR inputs must match their recorded sha256s.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/xdrgen/generate.py --check
      - run: python3 tools/update_xdr.py --check

  format:
    # clang-format on handwritten sources only; generated code is excluded.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: |
          git ls-files '*.hpp' '*.cpp' ':(exclude)*/generated/*' \
            | xargs clang-format --dry-run --Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: dev, cc: gcc, cxx: g++ }
          - { os: ubuntu-24.04, preset: dev, cc: clang, cxx: clang++ }
          - { os: macos-15, preset: dev }
          - { os: windows-2022, preset: msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install clang (ubuntu)
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install libsodium (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libcurl4-openssl-dev
      - name: Install libsodium (macos)
        if: runner.os == 'macOS'
        run: brew install libsodium curl
      - name: Configure (windows, vcpkg manifest)
        if: runner.os == 'Windows'
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
